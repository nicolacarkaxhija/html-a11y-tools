name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  pr-checks:
    name: PR Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PR title (conventional commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|chore|refactor|test|ci|perf|style|revert|build)(\(.+\))?(!)?: .+'; then
            echo "PR title follows conventional commits"
          else
            echo "PR title must follow conventional commits: type(scope)?: description"
            echo "Examples: feat(sfcc-a11y): add --quiet flag"
            echo "          fix: correct false positive in img-alt"
            exit 1
          fi

      - name: Check for changeset
        if: github.head_ref != 'changeset-release/main'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^\.changeset/[a-z][^/]+\.md$'; then
            echo "Changeset found"
          else
            echo "No changeset file found. Run 'npm run changeset' to create one."
            exit 1
          fi
